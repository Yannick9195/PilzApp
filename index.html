.mbar .now{box-shadow:inset 0 0 0 2px var(--ink)}

.mleg .k1{background:#cfe0ea;background:color-mix(in srgb,#2c6a88 28%,var(--card))}.dark .mleg .k1{background:color-mix(in srgb,#7cc0e0 28%,var(--card))}.mleg .kn{box-shadow:inset 0 0 0 2px var(--ink)}

    <a href="#mehr" data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/></svg>Profil</a>

<main class="wrap" id="view"></main>
<div class="sheet" id="sheet"><div class="bg" data-act="closeSheet"></div><div class="pan" id="sheetPan"></div></div>

<script src="data/species.js"></script>

<script>
(()=>{'use strict';
const V=window.VOCAB,SP=(window.SPECIES||[]).slice(),GE=window.GENERA||[],QS=window.QUESTIONS||[],PH=window.PHOTOS||{};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const pad=n=>String(n).padStart(2,'0');const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());const addDays=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return ds(new Date(y,m-1,d+n))};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const CL={weiss:'weiß',creme:'creme',gelb:'gelb',ocker:'ocker',orange:'orange',rot:'rot',rosa:'rosa',violett:'violett',blau:'blau',gruen:'grün',oliv:'oliv',braun:'braun',rotbraun:'rotbraun',grau:'grau',schwarz:'schwarz'};
const optsOf=c=>{const o=V.cats[c].o;return o==='colors'?Object.keys(V.colors).map(k=>[k,CL[k]]):o};
const lab=(c,v)=>{const o=optsOf(c).find(x=>x[0]===v);return o?o[1]:v};
const CATS=Object.keys(V.cats);
const COMBO={};(V.combos||[]).forEach(c=>c.parts.forEach(p=>COMBO[p]=c));
const UNITS=(()=>{const u=[],done=new Set();CATS.forEach(c=>{const cb=COMBO[c];if(cb){if(done.has(cb.key))return;done.add(cb.key);u.push({key:cb.key,l:cb.l,parts:cb.parts.slice(),sub:cb.sub})}else u.push({key:c,l:V.cats[c].l,parts:[c],sub:{}})});return u})();
const catLabel=c=>COMBO[c]?COMBO[c].l+' – '+COMBO[c].sub[c]:V.cats[c].l;
const TW=s=>s.tw?`<div class="tastew">⚠ ${esc(s.tw)}</div>`:'';
const SYN=window.SYN||{},VTD=window.VTD||{},INFO=window.INFO||{};
const GEF={t:['lebensgefährlich','deadly'],g:['ernst','bad'],l:['meist leicht','warn']};
const VTS={roh:'roh giftig',alk:'mit Alkohol giftig',indiv:'nicht für jeden verträglich',menge:'nur kleine Mengen',jung:'nur jung',zub:'besondere Zubereitung',schad:'Schadstoffe',unklar:'giftverdächtig'};
const pts=t=>String(t||'').split(' | ').filter(Boolean);
const ulist=t=>{const p=pts(t);return p.length>1?`<ul class="ul">${p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:esc(t)};
const SYNRX=[[/Phalloides/,'phal'],[/Orellanus/,'orel'],[/Gyromitra/,'gyro'],[/Pantherina/,'panth'],[/Muscarin/,'musc'],[/Psilocybin/,'psilo'],[/Coprinus|Acetaldehyd/,'copr'],[/Paxillus/,'paxi'],[/Equestre|Rhabdomyolyse/,'rhabd'],[/astrointestinal|Magen-Darm/,'gastro'],[/Acromelal/,'acro'],[/Pleurocybella/,'enzeph'],[/Morchella/,'morch'],[/Polyporsäure|Hapalopilus/,'polyp'],[/Proxima/,'prox'],[/Omphalotus/,'omph'],[/Scleroderma/,'scler']];
const linkSyn=h=>String(h).replace(/(?:Phalloides|Orellanus|Gyromitra|Pantherina|Muscarin|Psilocybin|Coprinus|Acetaldehyd|Paxillus|Equestre|Rhabdomyolyse|Magen-Darm|Acromelalgie|Pleurocybella|Morchella|Polyporsäure|Hapalopilus|Proxima|Omphalotus|Scleroderma)-Syndrom|[Gg]astrointestinale[sn]? Syndrom|Ergotismus/g,m=>{const k=m==='Ergotismus'?'ergot':(SYNRX.find(([r])=>r.test(m))||[])[1];return k&&SYN[k]?`<a class="synl" data-act="syn" data-k="${k}">${m}</a>`:m});
const iact=(c,v)=>{const x=String(v).replace(/^~/,'');return c==='sy'&&SYN[x]?` data-act="syn" data-k="${x}"`:c==='vt'&&VTD[x]?` data-act="vt" data-k="${x}"`:''};
function synCard(k,full){const d=SYN[k];if(!d)return '';const g=GEF[d.gefahr]||GEF.g;
 return `<div class="syn ${esc(d.gefahr||'')}"><div class="synh"><b>${esc(d.name)}</b><span class="b ${g[1]}">${g[0]}</span></div><p class="small" style="margin:4px 0 8px">${esc(d.kurz||'')}</p><dl class="syndl"><dt>Latenz</dt><dd>${esc(d.latenz||'')}</dd><dt>Symptome</dt><dd>${ulist(d.symptome)}</dd>${full?`<dt>Gift</dt><dd>${esc(d.gift||'')}</dd><dt>Verlauf</dt><dd>${ulist(d.verlauf)}</dd><dt>Behandlung</dt><dd>${esc(d.therapie||'')}</dd><dt>Typische Arten</dt><dd>${esc(d.arten||'')}</dd>${d.merke?`<dt>Merke</dt><dd><b>${esc(d.merke)}</b></dd>`:''}`:''}</dl>${full?'':`<button class="btn sm" data-act="syn" data-k="${k}">Gift, Verlauf &amp; Behandlung ›</button>`}</div>`}
function vtBox(s){return raw(s,'vt').map(v=>{const o=v[0]==='~',x=v.replace(/^~/,''),d=VTD[x]||{};return `<div class="hint ${x}"><b>⚠ ${esc(d.name||lab('vt',x))}${o?' <span class="n">(möglich)</span>':''}</b><div class="small">${esc(d.text||'')}</div></div>`}).join('')}
const vtBadges=s=>req(s,'vt').filter(x=>VTD[x]).map(x=>`<span class="b ${['unklar','alk','roh'].includes(x)?'bad':'warn'}" data-act="vt" data-k="${x}" style="cursor:pointer">${esc(VTS[x]||x)}</span>`).join('');
function synSection(s){const ks=raw(s,'sy').filter(v=>SYN[v.replace(/^~/,'')]);if(!ks.length)return '';return `<h3 style="margin-top:14px">Was passiert bei einer Vergiftung?</h3>`+ks.map(v=>(v[0]==='~'?'<div class="small mut" style="margin-top:8px">möglicherweise:</div>':'')+synCard(v.replace(/^~/,''),false)).join('')}
const synIds=k=>SP.filter(s=>raw(s,'sy').some(v=>v.replace(/^~/,'')===k));
const spLinks=l=>l.length?`<div class="chips">${l.map(s=>`<a class="chip" href="#art-${s.id}">${esc(s.de)}</a>`).join('')}</div>`:'<p class="small mut">Noch keine Art mit fertigem Steckbrief in der App.</p>';
const infoLinks=(s,ps)=>{const b=[];if(ps.includes('sy'))req(s,'sy').filter(k=>SYN[k]).forEach(k=>b.push(`<button class="btn sm" data-act="syn" data-k="${k}">ⓘ ${esc(SYN[k].name)}</button>`));if(ps.includes('vt'))req(s,'vt').filter(k=>VTD[k]).forEach(k=>b.push(`<button class="btn sm" data-act="vt" data-k="${k}">ⓘ ${esc(VTD[k].name)}</button>`));return b.length?`<div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px">${b.join('')}</div>`:''};
function openSheet(h){const p=$('#sheetPan');p.innerHTML=`<div class="sheethead"><span class="sp"></span><button class="btn sm" data-act="closeSheet">✕ Schließen</button></div>`+h;p.scrollTop=0;$('#sheet').classList.add('open')}
/* ---------- Daten ---------- */
SP.forEach(s=>{s.tr=s.tr||{};if(!s.tr.ss)s.tr.ss=['no'];if(!s.tr.sy){s.tr.sy=(s.tr.sw||[]).some(v=>/^~?(g|t)$/.test(v))?[]:['kein']}});
V.cats.sy.o=[['kein','kein (nicht giftig)']].concat(V.cats.sy.o.filter(o=>o[0]!=='kein'));
SP.sort((a,b)=>a.de.localeCompare(b.de,'de'));
const BY={};SP.forEach(s=>{BY[s.id]=s;s._q=norm([s.de,(s.alt||[]).join(' '),s.sci,(s.syn||[]).join(' '),s.gen,s.gde||'',s.fam].join(' '))+' '+[s.de,...(s.alt||[])].map(n=>norm(n).replace(/ /g,'')).join(' ')});
const GBY={};GE.forEach(g=>GBY[g.id]=g);
const GSP={};SP.forEach(s=>{(GSP[s.gen]=GSP[s.gen]||[]).push(s.id)});
const GDE={};SP.forEach(s=>{if(s.gde&&!GDE[s.gen])GDE[s.gen]=s.gde});
const gdeOf=n=>((GBY[String(n).toLowerCase()]||{}).de)||GDE[n]||'';
const genLabel=n=>esc(n)+(gdeOf(n)?' ('+esc(gdeOf(n))+')':'');
const raw=(s,c)=>(s.tr&&s.tr[c])||[];const req=(s,c)=>raw(s,c).filter(v=>v[0]!=='~');const opt=(s,c)=>raw(s,c).filter(v=>v[0]==='~').map(v=>v.slice(1));const allv=(s,c)=>raw(s,c).map(v=>v.replace(/^~/,''));
const swOf=s=>{const r=req(s,'sw');const order=['t','g','un','k','eg','e'];return order.find(x=>r.includes(x))||r[0]||'k'};
const PAIRS=(()=>{const m={};SP.forEach(a=>(a.vw||[]).forEach(v=>{if(v.id&&BY[v.id]&&v.id!==a.id){const k=[a.id,v.id].sort().join('|');(m[k]=m[k]||{a:k.split('|')[0],b:k.split('|')[1],h:[]}).h.push({from:a.id,to:v.id,t:v.t})}}));return m})();
/* ---------- Speicher ---------- */
const KEY='pilzapp-v1';
const newProfile=n=>({name:n,created:Date.now(),sp:{},q:{},du:{},notes:{},fav:{},cmp:[],days:{},settings:{newPerDay:10,session:20,cats:null,theme:'auto',spDeck:'1',qTopic:'all',lastBackup:0}});
let DB=(()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.profiles&&j.profiles[j.active])return j}catch(e){}return{active:'p1',profiles:{p1:newProfile('Mein Profil')}}})();
const P=()=>DB.profiles[DB.active];let saveOK=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));saveOK=true}catch(e){if(saveOK)toast('Achtung: Speichern im Browser nicht möglich – bitte Backup exportieren.');saveOK=false}};
const INTV=[0,0,1,3,7,14,30];
const card=(deck,id)=>P()[deck][id];
const boxOf=(deck,id)=>{const c=card(deck,id);return c?c.b||0:0};
const isDue=(deck,id,t=today())=>{const c=card(deck,id);return !!(c&&c.b>0&&c.d<=t)};
function dayLog(k){const t=today();const d=P().days[t]=P().days[t]||{};d[k]=(d[k]||0)+1}
function grade(deck,id,res){const m=P()[deck];const c=m[id]||{b:0,n:0,r:0,w:0};const wasNew=!c.b;c.n++;
  if(res==='ok'){c.r++;c.b=Math.min(6,(c.b||1)+1);c.d=addDays(today(),INTV[c.b])}
  else if(res==='mid'){c.b=Math.max(1,c.b||1);c.d=addDays(today(),1)}
  else{c.w++;c.b=1;c.d=today()}
  c.l=Date.now();m[id]=c;if(wasNew)dayLog('new_'+deck);dayLog('rev');save();return c}
const newToday=deck=>((P().days[today()]||{})['new_'+deck]||0);
/* ---------- Hilfen ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
function applyTheme(){const t=P().settings.theme||'auto';const d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d)}
const swBadge=s=>{if(!raw(s,'sw').length)return '<span class="b">Steckbrief folgt</span>';const k=swOf(s);const[l,c]=V.sw[k]||['?','neutral'];return `<span class="b ${c}">${k==='t'?'☠ ':''}${esc(l)}</span>`};
const lvBadge=s=>`<span class="b lv">${V.lv[s.lv]||s.lv}</span>`;
const protBadge=s=>{const r=req(s,'ss');return r.includes('bes')?'<span class="b prot">geschützt</span>':r.includes('ausn')?'<span class="b prot">geschützt (Eigenbedarf)</span>':''};
function dots(id){const b=boxOf('sp',id);if(!b)return'';if(b>=6)return'<div class="dots m"><i></i><i></i><i></i><i></i><i></i></div>';let h='';for(let i=1;i<=5;i++)h+=`<i class="${i<=b?'f':''}"></i>`;return `<div class="dots">${h}</div>`}
const colorOf=s=>V.colors[(allv(s,'hf')[0])||(allv(s,'lf')[0])]||'#a88b63';
function art(s){const c=colorOf(s),f=allv(s,'fk')[0]||'hut',st='#efe5cf',w='#8a6a48';let g='';
 if(f==='hut'||f==='seit')g=`<path d="M16 54Q50 10 84 54Z" fill="${c}"/><path d="M22 54h56" stroke="rgba(0,0,0,.18)" stroke-width="3"/><rect x="43" y="52" width="14" height="32" rx="6" fill="${st}"/>`;
 else if(f==='kons')g=`<rect x="8" y="6" width="16" height="88" rx="3" fill="${w}"/><path d="M24 34Q68 26 90 46Q66 58 24 56Z" fill="${c}"/><path d="M24 60Q58 56 78 68Q56 76 24 74Z" fill="${c}" opacity=".85"/>`;
 else if(f==='kora'||f==='kraus')g=`<g stroke="${c}" stroke-width="7" stroke-linecap="round" fill="none"><path d="M50 88V58M50 62 34 44M50 62 66 42M34 44 26 26M34 44 40 24M66 42 60 22M66 42 76 26"/></g>`;
 else if(f==='bech')g=`<path d="M18 42Q50 92 82 42Q50 56 18 42Z" fill="${c}"/><ellipse cx="50" cy="44" rx="32" ry="8" fill="rgba(0,0,0,.15)"/>`;
 else if(f==='kugel'||f==='knol')g=`<circle cx="50" cy="56" r="27" fill="${c}"/><g fill="rgba(255,255,255,.45)"><circle cx="40" cy="46" r="2.5"/><circle cx="54" cy="42" r="2"/><circle cx="60" cy="54" r="2.5"/><circle cx="46" cy="60" r="2"/></g>`;
 else if(f==='stern')g=`<path d="M50 60 14 76 34 56 20 40 42 46 50 24 58 46 80 40 66 56 86 76Z" fill="${c}"/><circle cx="50" cy="52" r="12" fill="${st}"/>`;
 else if(f==='phall')g=`<rect x="44" y="30" width="12" height="54" rx="5" fill="${st}"/><path d="M42 16h16l3 20H39Z" fill="${c}"/><ellipse cx="50" cy="86" rx="16" ry="6" fill="#ddd"/>`;
 else if(f==='morch')g=`<ellipse cx="50" cy="40" rx="20" ry="27" fill="${c}"/><g stroke="rgba(0,0,0,.25)" stroke-width="2" fill="none"><path d="M36 26h28M32 40h36M36 54h28M44 15v50M56 15v50"/></g><rect x="43" y="64" width="14" height="22" rx="5" fill="${st}"/>`;
 else if(f==='keul')g=`<path d="M44 86V44c0-14 12-14 12 0v42Z" fill="${c}"/><ellipse cx="50" cy="36" rx="9" ry="18" fill="${c}"/>`;
 else if(f==='gall')g=`<path d="M30 40c0-14 30-20 38-6s10 30-6 34-34 6-34-10 2-18 2-18Z" fill="${c}" opacity=".9"/>`;
 else g=`<g fill="${c}"><circle cx="34" cy="46" r="9"/><circle cx="56" cy="40" r="7"/><circle cx="62" cy="60" r="10"/><circle cx="42" cy="66" r="6"/></g>`;
 return `<svg class="ph" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${s.id.length}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe7cf"/><stop offset="1" stop-color="#c7b48e"/></linearGradient></defs><rect width="100" height="100" fill="url(#g${s.id.length})" opacity=".55"/><path d="M0 84Q50 76 100 84V100H0Z" fill="#7d6a48" opacity=".35"/>${g}</svg>`}
const photos=id=>PH[id]||[];
const PHT=window.PHOTO_THUMBS||{};
const BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const PKB={},PKU={};

/* Statistik */
function vStat(){const blk=(t,deck,ids)=>{const c=[0,0,0,0,0,0,0];ids.forEach(i=>c[boxOf(deck,i)]++);const mx=Math.max(1,...c);const s=stat(deck,ids);
 return `<div class="panel"><h3>${t}</h3><div class="small mut">${s.t} Karten · ${s.d} heute fällig · ${s.m} gemeistert (${Math.round(s.m/Math.max(1,s.t)*100)} %)</div><div class="boxes">${c.map(n=>`<div style="height:${n/mx*100}%"><span>${n}</span></div>`).join('')}</div><div class="boxl"><span>neu</span><span>F1</span><span>F2</span><span>F3</span><span>F4</span><span>F5</span><span>✓</span></div></div>`};
 const days=Object.entries(P().days).sort().slice(-14);
 view.innerHTML=`<p class="small"><a href="#lernen">← Lernen</a></p><h1>Statistik</h1>${blk('Arten – FM1','sp',deckIds('1'))}${blk('Arten – FM2','sp',deckIds('2'))}${blk('Arten – PSV-Zusatz','sp',deckIds('P'))}${blk('Prüfungsfragen','q',QS.map(q=>String(q.n)))}${blk('Doppelgänger','du',Object.keys(PAIRS))}
 <div class="panel"><h3>Letzte Lerntage</h3>${days.length?days.map(([d,v])=>`<div class="row small"><span>${d}</span><span class="sp"></span><span>${v.rev||0} Abfragen · ${(v.new_sp||0)+(v.new_q||0)+(v.new_du||0)} neu</span></div>`).join(''):'<div class="mut small">Noch keine Lerntage.</div>'}</div>`}
/* ---------- Profil & Einstellungen ---------- */
function vMehr(){const st=P().settings;const ac=activeCats();const lb=st.lastBackup?new Date(st.lastBackup).toLocaleDateString('de-DE'):'noch nie';
 view.innerHTML=`<h1>Profil</h1>
 <div class="panel"><h3>Lernprofile</h3><p class="small mut">Jedes Profil hat seinen eigenen Lernstand – praktisch, wenn mehrere Personen ein Gerät nutzen.</p><div class="chips">${Object.entries(DB.profiles).map(([k,p])=>`<span class="chip ${k===DB.active?'on':''}" data-act="prof" data-k="${k}">${esc(p.name)}</span>`).join('')}<span class="chip" data-act="profNew">+ Neues Profil</span></div>
  <div class="row" style="margin-top:10px"><button class="btn sm" data-act="profRen">Umbenennen</button>${Object.keys(DB.profiles).length>1?'<button class="btn sm bad" data-act="profDel">Profil löschen</button>':''}</div></div>
 <div class="panel"><h3>Backup</h3><p class="small mut">Der Lernstand wird nur in diesem Browser gespeichert. Sichere ihn regelmäßig – damit kannst du ihn auch auf ein anderes Gerät übertragen. Letztes Backup: <b>${lb}</b></p>
  <div class="row"><button class="btn pri" data-act="exp">⬇ Backup-Datei speichern</button><button class="btn" data-act="expCopy">Backup kopieren</button><label class="btn">⬆ Backup laden<input type="file" id="impf" accept=".json,application/json" hidden></label><button class="btn" data-act="impPaste">Backup einfügen</button></div></div>
 <div class="panel"><h3>Lernen</h3><div class="row small"><label>Neue Karten pro Tag <input class="inp" type="number" min="1" max="200" id="npd" value="${st.newPerDay}" style="width:90px"></label><label>Karten pro Runde <input class="inp" type="number" min="5" max="200" id="ses" value="${st.session}" style="width:90px"></label></div>
  <div class="fcat">Abgefragte Kategorien (Merkmals-Abfrage)</div><div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="catAll">Alle</button><button class="btn sm" data-act="catCore">Nur Kernmerkmale</button></div>
  <div class="chips">${UNITS.map(u=>`<span class="chip ${u.parts.every(c=>ac.includes(c))?'on':''}" data-act="catT" data-c="${u.parts.join(',')}">${esc(u.l)}</span>`).join('')}</div></div>
 <div class="panel"><h3>Darstellung</h3><div class="seg">${[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']].map(([k,l])=>`<button class="${(st.theme||'auto')===k?'on':''}" data-act="theme" data-k="${k}">${l}</button>`).join('')}</div></div>
 <div class="panel"><h3>Über diese App</h3><p class="small">Inhalte: ${SP.length} Arten (DGfM-Artenliste Feldmykologe Stufe 1+2, Stand 31.01.2022, ergänzt um weitere Arten aus dem PSV-Fragenkatalog), ${GE.length} Gattungsporträts, ${QS.length} Prüfungsfragen (DGfM, Stand 14.07.2025) mit Musterantworten. Speisewert-Angaben orientieren sich an der DGfM-Positivliste der Speisepilze und der DGfM-Liste der Pilze mit uneinheitlich beurteiltem Speisewert (Stand 01.05.2026). Fotos: Wikimedia Commons, Urheber und Lizenz jeweils am Bild.</p><p class="small mut">Diese App ist eine Lernhilfe. Sie ersetzt weder Fachliteratur noch die Beratung durch geprüfte Pilzsachverständige. Pilze niemals allein anhand einer App bestimmen und essen.</p>
 <p class="small"><b>Unabhängig nutzen:</b> Den App-Ordner (index.html + data/ + img/) kannst du kostenlos z. B. bei GitHub Pages oder Netlify hochladen und den Link teilen. Auf dem Handy über „Zum Home-Bildschirm“ installieren – dann funktioniert sie auch offline. Jede Person hat ihren eigenen Lernstand im eigenen Browser.</p></div>`;
 $('#npd').onchange=e=>{st.newPerDay=Math.max(1,+e.target.value||10);save()};$('#ses').onchange=e=>{st.session=Math.max(5,+e.target.value||20);save()};
 $('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(f)}}
ACT.prof=a=>{DB.active=a.dataset.k;save();applyTheme();vMehr();toast('Profil gewechselt: '+P().name)};
ACT.profNew=()=>askText('Name des neuen Profils','',n=>{const k='p'+Date.now();DB.profiles[k]=newProfile(n||'Profil');DB.active=k;save();vMehr()});
ACT.profRen=()=>askText('Neuer Name',P().name,n=>{if(n){P().name=n;save();vMehr()}});
ACT.profDel=()=>confirmBox(`Profil „${P().name}“ mit allem Lernstand löschen?`,()=>{delete DB.profiles[DB.active];DB.active=Object.keys(DB.profiles)[0];save();vMehr()});
function askText(title,val,cb){const pan=$('#sheetPan');pan.innerHTML=`<h3>${esc(title)}</h3><input class="inp" id="at" value="${esc(val)}"><div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Abbrechen</button><button class="btn pri" id="ay">OK</button></div>`;$('#sheet').classList.add('open');$('#at').focus();$('#ay').onclick=()=>{$('#sheet').classList.remove('open');cb($('#at').value.trim())}}
const exportJSON=()=>JSON.stringify({app:'pilzwissen',v:1,date:new Date().toISOString(),active:DB.active,profiles:DB.profiles});
ACT.exp=async()=>{const fn='pilzwissen-backup-'+today()+'.json';try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename:fn,data:exportJSON()});P().settings.lastBackup=Date.now();save();toast('Backup gespeichert');return}}}catch(e){toast('Download abgelehnt oder nicht möglich – nutze „Backup kopieren“');return}
 try{const b=new Blob([exportJSON()],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);P().settings.lastBackup=Date.now();save();toast('Backup gespeichert (falls kein Download startet: „Backup kopieren“ nutzen)')}catch(e){ACT.expCopy()}};
ACT.expCopy=()=>{const t=exportJSON();const done=()=>{P().settings.lastBackup=Date.now();save();toast('Backup in die Zwischenablage kopiert – z. B. in einer Notiz sichern')};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>showText(t));else showText(t)};
function showText(t){const pan=$('#sheetPan');pan.innerHTML=`<h3>Backup-Text</h3><p class="small mut">Alles markieren und kopieren:</p><textarea class="inp" style="min-height:220px" readonly>${esc(t)}</textarea><button class="btn" data-act="closeSheet" style="margin-top:10px">Schließen</button>`;$('#sheet').classList.add('open')}
ACT.impPaste=()=>{const pan=$('#sheetPan');pan.innerHTML=`<h3>Backup einfügen</h3><textarea class="inp" id="ip" style="min-height:200px" placeholder="Backup-Text hier einfügen"></textarea><div class="row" style="margin-top:10px"><button class="btn" data-act="closeSheet">Abbrechen</button><button class="btn pri" id="ipy">Laden</button></div>`;$('#sheet').classList.add('open');$('#ipy').onclick=()=>{$('#sheet').classList.remove('open');importData($('#ip').value)}};
function importData(txt){try{const j=JSON.parse(txt);if(!j.profiles)throw 0;confirmBox(`Backup vom ${(j.date||'').slice(0,10)} mit ${Object.keys(j.profiles).length} Profil(en) laden? Gleichnamige Profile auf diesem Gerät werden ersetzt.`,()=>{Object.assign(DB.profiles,j.profiles);if(j.active&&DB.profiles[j.active])DB.active=j.active;save();applyTheme();toast('Backup geladen');vMehr()})}catch(e){toast('Das ist keine gültige Backup-Datei.')}}
ACT.catT=a=>{const st=P().settings;let c=st.cats||CATS.slice();const ks=a.dataset.c.split(',');const on=ks.every(k=>c.includes(k));c=on?c.filter(x=>!ks.includes(x)):[...new Set([...c,...ks])];st.cats=CATS.filter(x=>c.includes(x));save();vMehr()};
ACT.catAll=()=>{P().settings.cats=null;save();vMehr()};ACT.catCore=()=>{P().settings.cats=V.core.slice();save();vMehr()};
ACT.theme=a=>{P().settings.theme=a.dataset.k;save();applyTheme();vMehr()};
/* ---------- Start ---------- */
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
route();
try{if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
</body>
